[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-sense-server"
version = "0.1.0"
description = "Civic Sense — FastAPI backend for civic issue reporting"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "pillow>=13.0",  # 13.0 fixes image-decoding advisories in 12.x
    "python-multipart>=0.0.9",
    "geoalchemy2>=0.15",
    "bcrypt>=4.2",
    "email-validator>=2.0",
]

[project.optional-dependencies]
ai = [
    "open-clip-torch>=2.26",
    "onnx>=1.22",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
]
# Training/export only (not needed to serve). Kept separate — tensorflow is heavy.
# NOTE: onnx2tf 2.6.9 pins onnx==1.20.1 / pytest==9.0.2 / setuptools==81.0.0
# which conflicts with the patched versions in `ai` / `dev`. Install `train`
# into a SEPARATE venv if you need to re-export the model; do not mix with
# the runtime venv. See SECURITY.md.
train = [
    "onnx2tf>=1.26",
    "tensorflow-cpu>=2.17",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
