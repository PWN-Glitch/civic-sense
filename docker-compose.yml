services:
  db:
    image: postgis/postgis:16-3.4
    container_name: civicsense_db
    environment:
      POSTGRES_PASSWORD: civicsense
      POSTGRES_USER: civicsense
      POSTGRES_DB: civicsense
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicsense"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
